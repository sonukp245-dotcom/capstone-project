<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Settings</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>User Settings</h1>
        <p class="subtitle">Update your profile and preferences.</p>

        <form id="settingsForm" novalidate>
          <div class="field">
            <label for="displayName">Display name</label>
            <input
              id="displayName"
              name="displayName"
              type="text"
              autocomplete="name"
              maxlength="50"
            />
            <p class="error" id="displayNameError" role="alert"></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
            />
            <p class="error" id="emailError" role="alert"></p>
          </div>

          <div class="field">
            <label for="theme">Theme</label>
            <select id="theme" name="theme">
              <option value="system">System default</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>

          <div class="field checkbox-field">
            <label>
              <input id="emailNotifications" name="emailNotifications" type="checkbox" />
              Email notifications
            </label>
          </div>

          <div class="field">
            <label for="password">New password (optional)</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
            />
            <p class="error" id="passwordError" role="alert"></p>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
            />
            <p class="error" id="confirmPasswordError" role="alert"></p>
          </div>

          <p class="success" id="formSuccess" role="status"></p>
          <button type="submit">Save settings</button>
        </form>
      </section>
    </main>
    <script src="/js/settings.js"></script>
  </body>
</html>
