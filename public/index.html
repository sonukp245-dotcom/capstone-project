<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Settings</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <h1>User Settings</h1>
      <p class="intro">
        Update your display name and email. Leave the password fields blank to
        keep your current password.
      </p>

      <p id="form-status" class="form-status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>

      <form id="settings-form" novalidate>
        <div class="field">
          <label for="display-name">Display name</label>
          <input
            id="display-name"
            name="displayName"
            type="text"
            autocomplete="name"
            required
            minlength="2"
            aria-describedby="display-name-error"
          />
          <p id="display-name-error" class="field-error"></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            aria-describedby="email-error"
          />
          <p id="email-error" class="field-error"></p>
        </div>

        <div class="field">
          <label for="password">New password (optional)</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            aria-describedby="password-error"
          />
          <p id="password-error" class="field-error"></p>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input
            id="confirm-password"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            aria-describedby="confirm-password-error"
          />
          <p id="confirm-password-error" class="field-error"></p>
        </div>

        <button type="submit">Save settings</button>
      </form>
    </main>
    <script src="js/settings.js"></script>
  </body>
</html>
