<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Settings</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <main class="page">
      <section class="card" aria-labelledby="settingsTitle">
        <h1 id="settingsTitle">User Settings</h1>
        <p class="subtitle">Update your profile and preferences.</p>

        <form id="settingsForm" novalidate>
          <div class="field">
            <label for="displayName">Full name</label>
            <input
              id="displayName"
              name="displayName"
              type="text"
              autocomplete="name"
              maxlength="50"
              required
              aria-describedby="displayNameError"
              aria-invalid="false"
            />
            <p
              class="error"
              id="displayNameError"
              role="alert"
              aria-live="polite"
            ></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              aria-describedby="emailError"
              aria-invalid="false"
            />
            <p
              class="error"
              id="emailError"
              role="alert"
              aria-live="polite"
            ></p>
          </div>

          <div class="field">
            <label for="theme">Theme</label>
            <select id="theme" name="theme">
              <option value="system">System default</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>

          <div class="field checkbox-field">
            <label for="emailNotifications">
              <input
                id="emailNotifications"
                name="emailNotifications"
                type="checkbox"
              />
              Email notifications
            </label>
          </div>

          <div class="field">
            <label for="password">New password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              aria-describedby="passwordError"
              aria-invalid="false"
            />
            <p
              class="error"
              id="passwordError"
              role="alert"
              aria-live="polite"
            ></p>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              aria-describedby="confirmPasswordError"
              aria-invalid="false"
            />
            <p
              class="error"
              id="confirmPasswordError"
              role="alert"
              aria-live="polite"
            ></p>
          </div>

          <p
            class="success"
            id="formSuccess"
            role="status"
            aria-live="polite"
          ></p>

          <button type="submit">Save settings</button>
        </form>
      </section>
    </main>

    <script src="/js/settings.js"></script>
  </body>
</html>
